<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Ghost Hunting Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100vh;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            max-width: 300px;
        }

        .hud-item {
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
        }

        .hud-item:last-child {
            border-bottom: none;
        }

        .label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .value {
            font-size: 18px;
            font-weight: bold;
            color: #00ff00;
            margin-top: 5px;
        }

        #camera-feed {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ff00;
            border-radius: 5px;
            z-index: 100;
        }

        #ghost-orbs {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            width: 200px;
            z-index: 100;
        }

        .orb {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-block;
            margin: 5px;
            box-shadow: 0 0 10px currentColor;
        }

        .orb-active {
            background-color: #ff0000;
            box-shadow: 0 0 20px #ff0000;
        }

        .orb-inactive {
            background-color: #333;
            opacity: 0.3;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            right: 250px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            font-size: 12px;
            z-index: 100;
        }

        #withering-effect {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        .ghost-indicator {
            position: absolute;
            width: 20px;
            height: 20px;
            background: radial-gradient(circle, rgba(255,100,100,0.8), rgba(255,0,0,0.3));
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div class="hud-item">
            <div class="label">EMF Level</div>
            <div class="value" id="emf-level">0</div>
        </div>
        <div class="hud-item">
            <div class="label">Temperature</div>
            <div class="value" id="temperature">72°F</div>
        </div>
        <div class="hud-item">
            <div class="label">Ghost Type</div>
            <div class="value" id="ghost-type">Unknown</div>
        </div>
        <div class="hud-item">
            <div class="label">Sanity</div>
            <div class="value" id="sanity">100%</div>
        </div>
        <div class="hud-item">
            <div class="label">Room</div>
            <div class="value" id="current-room">Lobby</div>
        </div>
    </div>

    <div id="ghost-orbs">
        <div class="label">Ghost Orbs</div>
        <div id="orb-container">
            <div class="orb orb-inactive"></div>
            <div class="orb orb-inactive"></div>
            <div class="orb orb-inactive"></div>
            <div class="orb orb-inactive"></div>
            <div class="orb orb-inactive"></div>
        </div>
    </div>

    <div id="camera-feed">
        <canvas id="cameraCanvas" width="200" height="150"></canvas>
    </div>

    <div class="controls">
        <div><strong>WASD</strong> - Move</div>
        <div><strong>Mouse</strong> - Look Around</div>
        <div><strong>SPACE</strong> - Jump</div>
        <div><strong>E</strong> - Interact</div>
        <div><strong>C</strong> - Toggle Camera</div>
    </div>

    <canvas id="withering-effect"></canvas>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
